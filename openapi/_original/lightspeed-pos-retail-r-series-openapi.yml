components:
  parameters:
    accountID:
      name: accountID
      in: path
      required: true
      description: The numeric Lightspeed Retail account identifier, resolved via GET /Account.json.
      schema:
        type: string
    itemID:
      name: itemID
      in: path
      required: true
      description: The unique identifier of the item.
      schema:
        type: string
    saleID:
      name: saleID
      in: path
      required: true
      description: The unique identifier of the sale.
      schema:
        type: string
    customerID:
      name: customerID
      in: path
      required: true
      description: The unique identifier of the customer.
      schema:
        type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth 2.0 authorization-code flow with scope-based access control.
      flows:
        authorizationCode:
          authorizationUrl: https://cloud.lightspeedapp.com/oauth/authorize.php
          tokenUrl: https://cloud.lightspeedapp.com/oauth/access_token.php
          scopes:
            employee:all: Full access to all account resources.
            employee:admin: Manage employees and shops.
            employee:inventory: Create and modify inventory items.
            employee:inventory_read: Read inventory items and catalog.
            employee:register: Create sales at the register.
            employee:reports: Read sales and reporting data.
            employee:customers: Create and modify customers.
            employee:customers_read: Read customers.
  schemas:
    Attributes:
      type: object
      description: Pagination metadata returned in list responses.
      properties:
        count:
          type: integer
          description: Total number of matching records.
        offset:
          type: integer
          description: Offset of the current page.
        limit:
          type: integer
          description: Page size limit.
    Account:
      type: object
      description: A Lightspeed Retail R-Series account.
      properties:
        accountID:
          type: string
          description: Unique numeric account identifier.
        name:
          type: string
          description: Account / business name.
        link:
          type: string
          description: API self-link for the account.
    Item:
      type: object
      description: An inventory item sold and tracked in Lightspeed Retail.
      properties:
        itemID:
          type: string
          description: Unique item identifier.
        systemSku:
          type: string
          description: System-assigned SKU.
        defaultCost:
          type: string
          description: Default cost of the item.
        avgCost:
          type: string
          description: Weighted average cost.
        description:
          type: string
          description: Item description / name.
        upc:
          type: string
          description: Universal Product Code.
        ean:
          type: string
          description: International Article Number.
        customSku:
          type: string
          description: Merchant-defined SKU.
        manufacturerSku:
          type: string
          description: Manufacturer SKU.
        categoryID:
          type: string
          description: Identifier of the owning category.
        manufacturerID:
          type: string
          description: Identifier of the manufacturer.
        archived:
          type: boolean
          description: Whether the item has been archived.
        Prices:
          type: object
          description: Item pricing levels.
    Sale:
      type: object
      description: A point-of-sale transaction.
      properties:
        saleID:
          type: string
          description: Unique sale identifier.
        timeStamp:
          type: string
          format: date-time
          description: When the sale occurred.
        completed:
          type: boolean
          description: Whether the sale has been completed.
        total:
          type: string
          description: Sale total including tax.
        totalDue:
          type: string
          description: Amount still owed on the sale.
        displayableTotal:
          type: string
          description: Human-readable total.
        discountPercent:
          type: string
          description: Sale-level discount percentage.
        customerID:
          type: string
          description: Identifier of the customer on the sale.
        employeeID:
          type: string
          description: Identifier of the employee who rang the sale.
        shopID:
          type: string
          description: Identifier of the shop where the sale occurred.
        registerID:
          type: string
          description: Identifier of the register used.
        SaleLines:
          type: object
          description: The line items on the sale.
          properties:
            SaleLine:
              type: array
              items:
                $ref: '#/components/schemas/SaleLine'
    SaleLine:
      type: object
      description: A single line item on a sale.
      properties:
        saleLineID:
          type: string
          description: Unique sale-line identifier.
        itemID:
          type: string
          description: Identifier of the item sold.
        saleID:
          type: string
          description: Identifier of the parent sale.
        unitQuantity:
          type: string
          description: Quantity sold.
        unitPrice:
          type: string
          description: Price per unit.
        normalUnitPrice:
          type: string
          description: List price per unit before discounts.
        discountID:
          type: string
          description: Identifier of any applied discount.
    Customer:
      type: object
      description: A customer record.
      properties:
        customerID:
          type: string
          description: Unique customer identifier.
        firstName:
          type: string
          description: Customer first name.
        lastName:
          type: string
          description: Customer last name.
        company:
          type: string
          description: Customer company name.
        contactID:
          type: string
          description: Identifier of the related contact record.
        discountID:
          type: string
          description: Default discount applied to the customer.
        taxCategoryID:
          type: string
          description: Tax category for the customer.
        Contact:
          $ref: '#/components/schemas/Contact'
    Contact:
      type: object
      description: Contact details associated with a customer.
      properties:
        contactID:
          type: string
          description: Unique contact identifier.
        custom:
          type: string
          description: Custom contact field.
        noEmail:
          type: boolean
          description: Whether the contact opted out of email.
        noPhone:
          type: boolean
          description: Whether the contact opted out of phone contact.
        noMail:
          type: boolean
          description: Whether the contact opted out of mail.
    Category:
      type: object
      description: An item category used to classify inventory.
      properties:
        categoryID:
          type: string
          description: Unique category identifier.
        name:
          type: string
          description: Category name.
        parentID:
          type: string
          description: Identifier of the parent category.
        fullPathName:
          type: string
          description: Fully qualified category path.
    Manufacturer:
      type: object
      description: A manufacturer of inventory items.
      properties:
        manufacturerID:
          type: string
          description: Unique manufacturer identifier.
        name:
          type: string
          description: Manufacturer name.
    Vendor:
      type: object
      description: A vendor (supplier) of inventory items.
      properties:
        vendorID:
          type: string
          description: Unique vendor identifier.
        name:
          type: string
          description: Vendor name.
        accountNumber:
          type: string
          description: Merchant account number with the vendor.
        contactID:
          type: string
          description: Identifier of the related contact record.
    Employee:
      type: object
      description: An employee of the retail account.
      properties:
        employeeID:
          type: string
          description: Unique employee identifier.
        firstName:
          type: string
          description: Employee first name.
        lastName:
          type: string
          description: Employee last name.
        shopID:
          type: string
          description: Identifier of the employee's home shop.
        limitToShopID:
          type: string
          description: Shop the employee is restricted to, if any.
    Shop:
      type: object
      description: A store location.
      properties:
        shopID:
          type: string
          description: Unique shop identifier.
        name:
          type: string
          description: Shop name.
        taxCategoryID:
          type: string
          description: Default tax category for the shop.
        timeZone:
          type: string
          description: IANA timezone of the shop.
