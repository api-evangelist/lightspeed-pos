                      avgCost: '12.50'
                      description: example
                      upc: example
                      ean: example
                      customSku: SKU-1001
                      manufacturerSku: SKU-1001
                      categoryID: '500123'
                      manufacturerID: '500123'
                      archived: true
                      Prices: {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    put:
      summary: Lightspeed Update Item
      operationId: updateItem
      description: Updates an existing inventory item.
      tags: [Item]
      security:
      - OAuth2: [employee:inventory]
      parameters:
      - $ref: '#/components/parameters/accountID'
      - $ref: '#/components/parameters/itemID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
            examples:
              UpdateItemRequestExample:
                summary: Default updateItem request
                x-microcks-default: true
                value:
                  itemID: '500123'
                  systemSku: SKU-1001
                  defaultCost: '12.50'
                  avgCost: '12.50'
                  description: example
                  upc: example
                  ean: example
                  customSku: SKU-1001
                  manufacturerSku: SKU-1001
                  categoryID: '500123'
                  manufacturerID: '500123'
                  archived: true
                  Prices: {}
      responses:
        '200':
          description: Item updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Item:
                    $ref: '#/components/schemas/Item'
              examples:
                UpdateItem200Example:
                  summary: Default updateItem 200 response
                  x-microcks-default: true
                  value:
                    Item:
                      itemID: '500123'
                      systemSku: SKU-1001
                      defaultCost: '12.50'
                      avgCost: '12.50'
                      description: example
                      upc: example
                      ean: example
                      customSku: SKU-1001
                      manufacturerSku: SKU-1001
                      categoryID: '500123'
                      manufacturerID: '500123'
                      archived: false
                      Prices: {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    delete:
      summary: Lightspeed Delete Item
      operationId: deleteItem
      description: Archives (deletes) an inventory item.
      tags: [Item]
      security:
      - OAuth2: [employee:inventory]
      parameters:
      - $ref: '#/components/parameters/accountID'
      - $ref: '#/components/parameters/itemID'
      responses:
        '204':
          description: Item archived.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /Account/{accountID}/Sale.json:
    get:
      summary: Lightspeed List Sales
      operationId: getSales
      description: Returns point-of-sale transactions for the account.
      tags: [Sale]
      security:
