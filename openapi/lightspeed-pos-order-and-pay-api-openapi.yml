        maximumSelection:
          type: integer
          format: int32
          description: The maximum number of items that can be selected from this item grouping. If null then no maximum is set.
          example: 3
        itemRichData:
          $ref: '#/components/schemas/apeItemRichData'
        items:
          description: List of items to select from.
          type: array
          items:
            $ref: '#/components/schemas/apeMenuItemEntryV2'
      description: Collections of item groups within the combo to select from.
  securitySchemes:
    OAuth2:
      description: 'The Lightspeed Restaurant K-Series APIs support OAuth2 authentication using the [authorization code grant flow](https://www.oauth.com/oauth2-servers/server-side-apps/authorization-code/).

        See our [Authorization Quick Start Guide](https://api-portal.lsk.lightspeed.app/quick-start/authentication/authorization-overview) for more details on how to authenticate.

