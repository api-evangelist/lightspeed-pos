            itemSku: '35'
            unitAmount: 1.0
            quantity: 1.0
            modifiers: []
            amountWithTax: 1.15
            amountLessTax: 1.0
            discountedAmount: 0.0
            grossUnitAmount: 1.0
            timeOfTransactionUtc: 2023-11-07T21:24:44.755+0000
            active: true
            subLineItems: []
            taxIncluded: false
        isTaxIncluded:
          type: boolean
          writeOnly: true
        taxIncluded:
          type: boolean
