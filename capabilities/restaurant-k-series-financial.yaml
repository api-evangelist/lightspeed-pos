        call: restaurant-k-series-financial.financial-apiGetReceiptByExternalReference
        with:
          businessLocationId: rest.businessLocationId
          externalReferenceId: rest.externalReferenceId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/f/finance/{businesslocationid}/aggregatedsales
      name: v1-f-finance-businesslocationid-aggregatedsales
      description: REST surface for Financial.
      operations:
      - method: GET
        name: financial-apiGetAggregatedSales
