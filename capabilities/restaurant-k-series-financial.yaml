        with:
          businessLocationId: rest.businessLocationId
          include: rest.include
          date: rest.date
          includeConsumers: rest.includeConsumers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/f/finance/{businesslocationid}/salebyexternalreference
      name: v1-f-finance-businesslocationid-salebyexternalreference
      description: REST surface for Financial.
      operations:
      - method: GET
