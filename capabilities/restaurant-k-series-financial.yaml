        call: restaurant-k-series-financial.financial-apiGetAccountingGroups
        with:
          businessLocationId: rest.businessLocationId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/f/finance/{businesslocationid}/financials/{from}/{to}
      name: v1-f-finance-businesslocationid-financials-from-to
      description: REST surface for Financial.
      operations:
      - method: GET
        name: financial-apiGetFinancials
        description: Lightspeed Get Financials
        call: restaurant-k-series-financial.financial-apiGetFinancials
        with:
          businessLocationId: rest.businessLocationId
          from: rest.from
          to: rest.to
          include: rest.include
          pageSize: rest.pageSize
