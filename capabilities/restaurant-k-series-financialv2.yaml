naftiko: 1.0.0-alpha2
info:
  label: Lightspeed Restaurant K-Series API — FinancialV2
  description: 'Restaurant — FinancialV2. 4 operations. Lead operation: Lightspeed Get Sales. Self-contained Naftiko capability covering one Lightspeed business surface.'
  tags:
  - Lightspeed
  - Restaurant
  - FinancialV2
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    LIGHTSPEED_K_SERIES_TOKEN: LIGHTSPEED_K_SERIES_TOKEN
capability:
  consumes:
  - type: http
    namespace: restaurant-k-series-financialv2
    baseUri: https://api.lsk.lightspeed.app
    description: Lightspeed Restaurant K-Series API — FinancialV2 business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.LIGHTSPEED_K_SERIES_TOKEN}}'
    resources:
    - name: f-v2-business-location-businesslocationid-sales
      path: /f/v2/business-location/{businessLocationId}/sales
      operations:
      - name: financial-apiGetBusinessLocationSales
        method: GET
        description: Lightspeed Get Sales
        inputParameters:
        - name: businessLocationId
          in: path
          type: integer
          required: true
          description: The unique identifier for the business location.
        - name: from
          in: query
          type: string
          required: true
          description: 'Start of requested results, in ISO 8601 format.


            The date range between ''from'' and ''to'' cannot exceed 365 days (1 year).


            Based on the timeClosed sales field.'
        - name: to
          in: query
          type: string
          required: false
          description: 'End of requested results, in ISO 8601 format.


            Based on the timeClosed sales field.


            If the `to` date is set to a future date or not included, it will be adjusted to the current

            date and time to retrieve the most recent data available.'
        - name: include
          in: query
          type: string
          required: false
          description: 'Objects to be included in the response.


            The allowed values are: `staff`, `table`, `consumer`, `payments`, `revenue_center`, `account_profile`, `payment_authorization`.'
        - name: pageSize
          in: query
          type: integer
          required: false
          description: Number of entries to return.
        - name: nextPageToken
          in: query
          type: string
          required: false
          description: A token that indicates the starting point of the next set of records when paginating through results.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: f-v2-business-location-businesslocationid-sales-daily
      path: /f/v2/business-location/{businessLocationId}/sales-daily
      operations:
      - name: financial-apiGetBusinessLocationSalesOfABusinessDay
        method: GET
        description: Lightspeed Get Business Day Sales
        inputParameters:
        - name: businessLocationId
          in: path
          type: integer
          required: true
          description: The unique identifier for the business location.
        - name: date
          in: query
          type: string
          required: true
          description: 'The date of the business day to get sales for.


            Example:`2022-09-21` or `2022-12-01`'
        - name: include
          in: query
          type: string
          required: false
          description: 'Objects to be included in the response.


            The allowed values are: `staff`, `table`, `consumer`, `payments`, `revenue_center`, `account_profile`, `payment_authorization`.'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: f-v2-business-location-businesslocationid-lightspeed-payments
      path: /f/v2/business-location/{businessLocationId}/lightspeed-payments
      operations:
      - name: financial-apiGetLightspeedPayments
        method: GET
        description: Lightspeed Payments Data
        inputParameters:
        - name: businessLocationId
          in: path
          type: integer
          required: true
          description: The unique identifier for the business location.
        - name: from
          in: query
          type: string
          required: true
          description: 'Start of requested results, in ISO 8601 format.


            The date range between ''from'' and ''to'' cannot exceed 365 days (1 year).


            Results queried by the dateType parameter.'
        - name: to
          in: query
          type: string
          required: false
          description: 'End of requested results, in ISO 8601 format.


            Results queried by the dateType parameter.'
        - name: pageSize
          in: query
          type: integer
          required: false
          description: Number of entries to return.
        - name: offset
          in: query
          type: integer
          required: false
          description: ''
        - name: sortDirection
          in: query
          type: string
          required: false
          description: ''
        - name: dateType
          in: query
          type: string
          required: false
          description: ''
        - name: status
          in: query
          type: array
          required: false
          description: Payment statuses to filter the result set by.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: f-v2-beta-business-location-businesslocationid-aborted-orders
      path: /f/v2/beta/business-location/{businessLocationId}/aborted-orders
      operations:
      - name: financial-apiGetBusinessLocationAbortedOrdersOfABusinessDay
        method: GET
        description: Lightspeed BETA - Get Aborted Orders
        inputParameters:
        - name: businessLocationId
          in: path
          type: integer
          required: true
          description: The unique identifier for the business location.
        - name: date
          in: query
          type: string
          required: true
          description: The business date of the aborted orders.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: restaurant-k-series-financialv2-rest
    port: 8080
    description: REST adapter for Lightspeed Restaurant K-Series API — FinancialV2. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/f/v2/business-location/{businesslocationid}/sales
      name: v1-f-v2-business-location-businesslocationid-sales
      description: REST surface for FinancialV2.
      operations:
      - method: GET
        name: financial-apiGetBusinessLocationSales
        description: Lightspeed Get Sales
        call: restaurant-k-series-financialv2.financial-apiGetBusinessLocationSales
        with:
          businessLocationId: rest.businessLocationId
          from: rest.from
          to: rest.to
          include: rest.include
          pageSize: rest.pageSize
          nextPageToken: rest.nextPageToken
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/f/v2/business-location/{businesslocationid}/sales-daily
      name: v1-f-v2-business-location-businesslocationid-sales-daily
      description: REST surface for FinancialV2.
      operations:
      - method: GET
        name: financial-apiGetBusinessLocationSalesOfABusinessDay
        description: Lightspeed Get Business Day Sales
        call: restaurant-k-series-financialv2.financial-apiGetBusinessLocationSalesOfABusinessDay
        with:
          businessLocationId: rest.businessLocationId
          date: rest.date
          include: rest.include
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/f/v2/business-location/{businesslocationid}/lightspeed-payments
      name: v1-f-v2-business-location-businesslocationid-lightspeed-payments
      description: REST surface for FinancialV2.
      operations:
      - method: GET
        name: financial-apiGetLightspeedPayments
        description: Lightspeed Payments Data
        call: restaurant-k-series-financialv2.financial-apiGetLightspeedPayments
        with:
          businessLocationId: rest.businessLocationId
          from: rest.from
          to: rest.to
          pageSize: rest.pageSize
          offset: rest.offset
          sortDirection: rest.sortDirection
          dateType: rest.dateType
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/f/v2/beta/business-location/{businesslocationid}/aborted-orders
      name: v1-f-v2-beta-business-location-businesslocationid-aborted-orders
      description: REST surface for FinancialV2.
      operations:
      - method: GET
        name: financial-apiGetBusinessLocationAbortedOrdersOfABusinessDay
        description: Lightspeed BETA - Get Aborted Orders
        call: restaurant-k-series-financialv2.financial-apiGetBusinessLocationAbortedOrdersOfABusinessDay
        with:
          businessLocationId: rest.businessLocationId
          date: rest.date
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: restaurant-k-series-financialv2-mcp
    port: 9090
    transport: http
    description: MCP adapter for Lightspeed Restaurant K-Series API — FinancialV2. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: get-sales
      description: Lightspeed Get Sales
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-k-series-financialv2.financial-apiGetBusinessLocationSales
      with:
        businessLocationId: tools.businessLocationId
        from: tools.from
        to: tools.to
        include: tools.include
        pageSize: tools.pageSize
        nextPageToken: tools.nextPageToken
      outputParameters:
      - type: object
        mapping: $.
    - name: get-business-day-sales
      description: Lightspeed Get Business Day Sales
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-k-series-financialv2.financial-apiGetBusinessLocationSalesOfABusinessDay
      with:
        businessLocationId: tools.businessLocationId
        date: tools.date
        include: tools.include
      outputParameters:
      - type: object
        mapping: $.
    - name: payments-data
      description: Lightspeed Payments Data
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-k-series-financialv2.financial-apiGetLightspeedPayments
      with:
        businessLocationId: tools.businessLocationId
        from: tools.from
        to: tools.to
        pageSize: tools.pageSize
        offset: tools.offset
        sortDirection: tools.sortDirection
        dateType: tools.dateType
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
    - name: beta-get-aborted-orders
      description: Lightspeed BETA - Get Aborted Orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: restaurant-k-series-financialv2.financial-apiGetBusinessLocationAbortedOrdersOfABusinessDay
      with:
        businessLocationId: tools.businessLocationId
        date: tools.date
      outputParameters:
      - type: object
        mapping: $.
