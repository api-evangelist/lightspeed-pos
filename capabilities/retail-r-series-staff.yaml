naftiko: 1.0.0-alpha2
info:
  label: Lightspeed Retail R-Series API — Staff
  description: 'Retail — Staff. 2 operations. Lead operation: Lightspeed List Employees. Self-contained Naftiko capability covering one Lightspeed business surface.'
  tags:
  - Lightspeed
  - Retail
  - Staff
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    LIGHTSPEED_R_SERIES_TOKEN: LIGHTSPEED_R_SERIES_TOKEN
capability:
  consumes:
  - type: http
    namespace: retail-r-series-staff
    baseUri: https://api.lightspeedapp.com/API/V3
    description: Lightspeed Retail R-Series API — Staff business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.LIGHTSPEED_R_SERIES_TOKEN}}'
    resources:
    - name: account-accountid-employee-json
      path: /Account/{accountID}/Employee
      operations:
      - name: getEmployees
        method: GET
        description: Lightspeed List Employees
        inputParameters:
        - name: accountID
          in: path
          type: string
          required: true
          description: The numeric Lightspeed Retail account identifier, resolved via GET /Account.json.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: account-accountid-shop-json
      path: /Account/{accountID}/Shop
      operations:
      - name: getShops
        method: GET
        description: Lightspeed List Shops
        inputParameters:
        - name: accountID
          in: path
          type: string
          required: true
          description: The numeric Lightspeed Retail account identifier, resolved via GET /Account.json.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: retail-r-series-staff-rest
    port: 8080
    description: REST adapter for Lightspeed Retail R-Series API — Staff. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/account/{accountid}/employee
      name: v1-account-accountid-employee
      description: REST surface for Staff.
      operations:
      - method: GET
        name: getEmployees
        description: Lightspeed List Employees
        call: retail-r-series-staff.getEmployees
        with:
          accountID: rest.accountID
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/account/{accountid}/shop
      name: v1-account-accountid-shop
      description: REST surface for Staff.
      operations:
      - method: GET
        name: getShops
        description: Lightspeed List Shops
        call: retail-r-series-staff.getShops
        with:
          accountID: rest.accountID
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: retail-r-series-staff-mcp
    port: 9090
    transport: http
    description: MCP adapter for Lightspeed Retail R-Series API — Staff. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: list-employees
      description: Lightspeed List Employees
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: retail-r-series-staff.getEmployees
      with:
        accountID: tools.accountID
      outputParameters:
      - type: object
        mapping: $.
    - name: list-shops
      description: Lightspeed List Shops
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: retail-r-series-staff.getShops
      with:
        accountID: tools.accountID
      outputParameters:
      - type: object
        mapping: $.
