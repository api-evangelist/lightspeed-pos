naftiko: 1.0.0-alpha2
info:
  label: Lightspeed Retail R-Series API — Catalog
  description: 'Retail — Catalog. 3 operations. Lead operation: Lightspeed List Categories. Self-contained Naftiko capability covering one Lightspeed business surface.'
  tags:
  - Lightspeed
  - Retail
  - Catalog
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    LIGHTSPEED_R_SERIES_TOKEN: LIGHTSPEED_R_SERIES_TOKEN
capability:
  consumes:
  - type: http
    namespace: retail-r-series-catalog
    baseUri: https://api.lightspeedapp.com/API/V3
    description: Lightspeed Retail R-Series API — Catalog business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.LIGHTSPEED_R_SERIES_TOKEN}}'
    resources:
    - name: account-accountid-category-json
      path: /Account/{accountID}/Category
      operations:
      - name: getCategories
        method: GET
        description: Lightspeed List Categories
        inputParameters:
        - name: accountID
          in: path
          type: string
          required: true
          description: The numeric Lightspeed Retail account identifier, resolved via GET /Account.json.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: account-accountid-manufacturer-json
      path: /Account/{accountID}/Manufacturer
      operations:
      - name: getManufacturers
        method: GET
        description: Lightspeed List Manufacturers
        inputParameters:
        - name: accountID
          in: path
          type: string
          required: true
          description: The numeric Lightspeed Retail account identifier, resolved via GET /Account.json.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: account-accountid-vendor-json
      path: /Account/{accountID}/Vendor
      operations:
      - name: getVendors
        method: GET
        description: Lightspeed List Vendors
        inputParameters:
        - name: accountID
          in: path
          type: string
          required: true
          description: The numeric Lightspeed Retail account identifier, resolved via GET /Account.json.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: retail-r-series-catalog-rest
    port: 8080
    description: REST adapter for Lightspeed Retail R-Series API — Catalog. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/account/{accountid}/category
      name: v1-account-accountid-category
      description: REST surface for Catalog.
      operations:
      - method: GET
        name: getCategories
        description: Lightspeed List Categories
        call: retail-r-series-catalog.getCategories
        with:
          accountID: rest.accountID
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/account/{accountid}/manufacturer
      name: v1-account-accountid-manufacturer
      description: REST surface for Catalog.
      operations:
      - method: GET
        name: getManufacturers
        description: Lightspeed List Manufacturers
        call: retail-r-series-catalog.getManufacturers
        with:
          accountID: rest.accountID
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/account/{accountid}/vendor
      name: v1-account-accountid-vendor
      description: REST surface for Catalog.
      operations:
      - method: GET
        name: getVendors
        description: Lightspeed List Vendors
        call: retail-r-series-catalog.getVendors
        with:
          accountID: rest.accountID
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: retail-r-series-catalog-mcp
    port: 9090
    transport: http
    description: MCP adapter for Lightspeed Retail R-Series API — Catalog. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: list-categories
      description: Lightspeed List Categories
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: retail-r-series-catalog.getCategories
      with:
        accountID: tools.accountID
      outputParameters:
      - type: object
        mapping: $.
    - name: list-manufacturers
      description: Lightspeed List Manufacturers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: retail-r-series-catalog.getManufacturers
      with:
        accountID: tools.accountID
      outputParameters:
      - type: object
        mapping: $.
    - name: list-vendors
      description: Lightspeed List Vendors
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: retail-r-series-catalog.getVendors
      with:
        accountID: tools.accountID
      outputParameters:
      - type: object
        mapping: $.
