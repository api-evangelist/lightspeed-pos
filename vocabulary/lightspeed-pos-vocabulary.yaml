  personas:
  - id: restaurant-operator
    name: Restaurant Operator
    description: Runs front-of-house Order & Pay, checks, menus and tables on K-Series.
    workflows:
    - Lightspeed Restaurant K-Series API — Order and Pay
    - Lightspeed Restaurant K-Series API — Items
  - id: retail-merchandiser
    name: Retail Merchandiser
    description: Manages catalog, items and inventory across R-Series and X-Series.
    workflows:
    - Lightspeed Retail R-Series API — Item
    - Lightspeed Retail R-Series API — Catalog
  - id: finance-analyst
    name: Finance Analyst
    description: Reads financials, aggregated sales and tax data for reporting.
    workflows:
    - Lightspeed Restaurant K-Series API — Financial
    - Lightspeed Restaurant K-Series API — FinancialV2
  - id: integration-developer
    name: Integration Developer
    description: Wires webhooks, PMS providers and reservation platforms into Lightspeed.
    workflows:
    - 'Lightspeed Restaurant K-Series API — Order and Pay: Webhook'
    - Lightspeed Restaurant K-Series API — PMS
