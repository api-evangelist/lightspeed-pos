- aid: lightspeed-pos:lightspeed-pos-financial-api
  name: Lightspeed Financial API
  description: >-
    V1 endpoints (`/f/finance/...`) for retrieving sales and financial data.


    For the newer V2 versions of these endpoints see FinancialV2


    ### V1 behaviour


    - **Sorting**: No guaranteed sorting order; internal transformations may alter order unpredictably

    - **Transitory Accounts / Unsettled Sales**: Returns closed transactions only

    - **Pagination**: `pageSize` max of 1000. Uses HATEOAS `_links` with `self` and `nextPage` URLs

    - **Daily endpoints** (`getDailyFinancials`): No pagination, no hard cap on results. May have slower
    response times for larger data sets

    - **Backoffice transactions**: Historical dating supported. Transactions will be dated to a past date
    if the action impacts past reports. Can query transactions by original business date

    - **Backoffice modifications** (payment method change and canceling): Modifications appear on the
    original transaction date
  humanURL: https://x-series-api.lightspeedhq.com/
  baseURL: https://x-series-api.lightspeedhq.com/api/2.0
  tags:
  - Financial
  properties:
  - type: OpenAPI
    url: openapi/lightspeed-pos-financial-api-openapi.yml
  - type: Documentation
    url: https://x-series-api.lightspeedhq.com/
  - type: Documentation
    url: https://developers.lightspeedhq.com/retail/introduction/introduction/
