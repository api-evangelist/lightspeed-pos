name: Lightspeed
x-type: company
description: 'Lightspeed (Lightspeed Commerce) operates a portfolio of Retail, Restaurant, eCom, and Golf
  POS platforms via series-named product lines: X-Series (Vend), R-Series (Retail Pro/Cloud), C-Series
  (eCom), E-Series (Ecwid), K-Series (Restaurant Lightspeed), L-Series, O-Series (Kounta), G-Series (Gastrofix),
  and the ChronoGolf Partner API.'
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
- POS
- Retail
- Restaurant
- Ecommerce
created: '2026-05-08'
modified: '2026-05-08'
specificationVersion: '0.19'
