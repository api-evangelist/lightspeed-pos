aid: lightspeed-pos
url: https://raw.githubusercontent.com/api-evangelist/lightspeed-pos/refs/heads/main/apis.yml
name: Lightspeed
kind: company
description: >-
  Lightspeed (Lightspeed Commerce) operates a portfolio of Retail, Restaurant, eCom, and Golf POS platforms via
  series-named product lines: X-Series (Vend), R-Series (Retail Pro/Cloud), C-Series (eCom), E-Series (Ecwid), K-Series
  (Restaurant Lightspeed), L-Series, O-Series (Kounta), G-Series (Gastrofix), and the ChronoGolf Partner API.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
  - POS
  - Retail
  - Restaurant
  - Ecommerce
created: '2026-05-08'
modified: '2026-06-02'
specificationVersion: '0.19'
apis:
  - aid: lightspeed:retail-x-series
    name: Lightspeed Retail X-Series API (Vend)
    description: >-
      REST API for Lightspeed Retail X-Series, formerly Vend. Covers products, customers, sales, inventory, suppliers,
      registers, taxes, and outlets.
    humanURL: https://x-series-api.lightspeedhq.com/
    baseURL: https://x-series-api.lightspeedhq.com/api/2.0
    tags:
      - REST
      - Retail
      - Vend
    properties:
      - type: Documentation
        url: https://x-series-api.lightspeedhq.com/
      - type: OpenAPI
        url: openapi/lightspeed-pos-retail-x-series-openapi.yml
  - aid: lightspeed:retail-r-series
    name: Lightspeed Retail R-Series API
    description: >-
      REST API for Lightspeed Retail R-Series (Retail Pro / Cloud). Covers items, sales, customers, employees, shops,
      and inventory.
    humanURL: https://developers.lightspeedhq.com/retail/introduction/introduction/
    baseURL: https://api.lightspeedapp.com/API/V3
    tags:
      - REST
      - Retail
    properties:
      - type: Documentation
        url: https://developers.lightspeedhq.com/retail/introduction/introduction/
      - type: OpenAPI
        url: openapi/lightspeed-pos-retail-r-series-openapi.yml
      - type: CodeExamples
        title: Postman Collection
        url: https://www.postman.com/lightspeedhq/r-series-api/documentation/01jc01h/r-series-collection
  - aid: lightspeed:ecom-c-series
    name: Lightspeed eCom C-Series API
    description: REST API for the Lightspeed eCom C-Series storefront platform.
    humanURL: https://developers.lightspeedhq.com/ecom/introduction/introduction/
    tags:
      - REST
      - Ecommerce
    properties:
      - type: Documentation
        url: https://developers.lightspeedhq.com/ecom/introduction/introduction/
  - aid: lightspeed:ecom-e-series
    name: Lightspeed eCom E-Series API (Ecwid)
    description: REST API for Ecwid-powered Lightspeed eCom E-Series stores.
    humanURL: https://api-docs.ecwid.com/
    tags:
      - REST
      - Ecommerce
      - Ecwid
    properties:
      - type: Documentation
        url: https://api-docs.ecwid.com/
  - aid: lightspeed:restaurant-k-series
    name: Lightspeed Restaurant K-Series API
    description: >-
      REST API for Lightspeed Restaurant K-Series, the flagship cloud restaurant POS. Covers items and rich items,
      menus, modifiers and discounts, orders (Order & Pay), checks and payments, floorplans and tables, staff and
      webhooks, financials and aggregated sales, tax breakdown, PMS integration, reservations, and ID cards.
    humanURL: https://api-docs.lsk.lightspeed.app/
    baseURL: https://api.lsk.lightspeed.app
    tags:
      - REST
      - Restaurant
      - K-Series
    properties:
      - type: Documentation
        url: https://api-docs.lsk.lightspeed.app/
      - type: Documentation
        title: Developer Portal
        url: https://api-portal.lsk.lightspeed.app/
      - type: OpenAPI
        url: openapi/lightspeed-pos-restaurant-k-series-openapi.yml
  - aid: lightspeed:restaurant-l-series
    name: Lightspeed Restaurant L-Series API
    description: REST API for the Lightspeed Restaurant L-Series cloud POS.
    humanURL: https://developers.lightspeedhq.com/
    tags:
      - REST
      - Restaurant
    properties:
      - type: Documentation
        url: https://developers.lightspeedhq.com/
  - aid: lightspeed:restaurant-o-series
    name: Lightspeed Restaurant O-Series API (Kounta)
    description: REST API for Lightspeed Restaurant O-Series (Kounta).
    humanURL: https://developers.kounta.com/
    tags:
      - REST
      - Restaurant
      - Kounta
    properties:
      - type: Documentation
        url: https://developers.kounta.com/
  - aid: lightspeed:restaurant-g-series
    name: Lightspeed Restaurant G-Series API (Gastrofix)
    description: REST API for Lightspeed Restaurant G-Series (Gastrofix).
    humanURL: https://developers.lightspeedhq.com/
    tags:
      - REST
      - Restaurant
      - Gastrofix
    properties:
      - type: Documentation
        url: https://developers.lightspeedhq.com/
  - aid: lightspeed:chronogolf-partner
    name: Lightspeed ChronoGolf Partner API
    description: Partner API for ChronoGolf, Lightspeed's tee-time and course management platform.
    humanURL: https://developers.lightspeedhq.com/
    tags:
      - REST
      - Golf
      - Partner
    properties:
      - type: Documentation
        url: https://developers.lightspeedhq.com/
